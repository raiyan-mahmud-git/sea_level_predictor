[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sea-level-predictor"
version = "1.0.0"
description = "freeCodeCamp Sea Level Predictor – upgraded to a full Streamlit data-analysis app"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "raiyan-mahmud-git" }]
keywords = ["sea-level", "climate", "data-analysis", "streamlit", "freecodecamp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "streamlit>=1.36.0,<2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]
export = ["kaleido>=0.2.1"]

[project.scripts]
sea-level-app = "app:main"

[tool.pytest.ini_options]
testpaths = ["tests", "test_module.py"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "B008",   # do not perform function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # assert is fine in tests
"test_module.py" = ["ALL"]  # legacy file – do not lint

[tool.setuptools.packages.find]
where = ["."]
include = ["sealevel*", "views*", "ui*"]
